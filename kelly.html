<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0530">
<title>Kelly Cards</title>
<style>
:root{
  --bl:#1a0530;--bl2:#2d0a50;--bl3:#6a0dad;
  --pk:#ff006e;--pk2:#ff4da6;
  --cy:#00f5ff;--gd:#FFD700;
  --wh:#fff;--sv:#b39ddb;
  --g1:rgba(255,255,255,.08);--g2:rgba(255,255,255,.15);
  --bd:rgba(255,255,255,.15);
  --nav:64px;--hdr:60px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#0d0020;color:var(--wh);}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bl);}
.stb{height:var(--st);background:var(--bl);flex-shrink:0;}
.hdr{height:var(--hdr);background:var(--bl2);border-bottom:2px solid var(--pk);display:flex;align-items:center;padding:0 16px;flex-shrink:0;}
.logo{font-size:1.4rem;font-weight:900;flex:1;background:linear-gradient(90deg,var(--pk),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + var(--sb) + 70px);display:none;background:var(--bl);}
.page.active{display:block;}
.bnav{height:calc(var(--nav) + var(--sb));background:#0d0020;border-top:1px solid var(--bd);display:flex;align-items:flex-start;padding-top:6px;padding-bottom:var(--sb);flex-shrink:0;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 0;}
.ni-ico{width:42px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1rem;}
.ni-lbl{font-size:.58rem;font-weight:700;text-transform:uppercase;color:var(--sv);}
.ni.active .ni-ico{background:rgba(255,0,110,.3);}
.ni.active .ni-lbl{color:var(--pk);}
.fab{position:fixed;bottom:calc(var(--nav) + var(--sb) + 14px);right:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--pk2));border:none;color:#fff;font-size:1.6rem;cursor:pointer;z-index:100;box-shadow:0 4px 20px rgba(255,0,110,.5);display:flex;align-items:center;justify-content:center;}
.ss{display:flex;gap:8px;padding:12px 14px 0;}
.sc{flex:1;background:var(--g1);border:1px solid var(--bd);border-radius:11px;padding:9px 6px;text-align:center;}
.sv2{font-size:1.6rem;font-weight:900;color:var(--gd);line-height:1;}
.sl2{font-size:.56rem;font-weight:700;text-transform:uppercase;color:var(--sv);margin-top:1px;}
.sw{padding:10px 14px 0;position:relative;}
.sin{width:100%;height:40px;background:var(--g1);border:1px solid var(--bd);border-radius:10px;padding:0 14px 0 38px;color:#fff;font-size:.88rem;outline:none;}
.sin::placeholder{color:var(--sv);}
.sic{position:absolute;left:26px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.5;}
.chips{display:flex;gap:7px;padding:8px 14px 0;overflow-x:auto;cursor:grab;}
.chips::-webkit-scrollbar{display:none;}
.chip{font-size:.7rem;font-weight:700;text-transform:uppercase;padding:5px 12px;border-radius:18px;border:1px solid var(--bd);background:var(--g1);color:var(--sv);white-space:nowrap;cursor:pointer;flex-shrink:0;}
.chip.active{background:var(--pk);color:#fff;border-color:var(--pk);}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:10px 14px 0;}
.ctile{background:var(--g1);border:1px solid var(--bd);border-radius:13px;overflow:hidden;cursor:pointer;}
.ctile:active{opacity:.8;}
.ctile-img{width:100%;aspect-ratio:2.5/3.5;background:var(--bl2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.ctile-img img{width:100%;height:100%;object-fit:cover;}
.tbadges{position:absolute;top:5px;left:5px;display:flex;flex-wrap:wrap;gap:2px;}
.b{font-size:.52rem;font-weight:700;text-transform:uppercase;padding:2px 4px;border-radius:3px;line-height:1.4;}
.ba{background:var(--gd);color:#000;}
.bm{background:#9b59b6;color:#fff;}
.bn{background:var(--pk);color:#fff;}
.bgr{background:#2ecc71;color:#000;}
.bc{background:#ff6b35;color:#fff;}
.bii{background:#00f5ff;color:#000;}
.cinfo{padding:7px 9px;}
.cnum{font-size:.62rem;color:var(--sv);}
.cna{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0;}
.cpl{font-size:.68rem;color:var(--sv);}
.ca{display:flex;border-top:1px solid var(--bd);}
.cab{flex:1;padding:7px 0;border:none;background:transparent;font-size:.68rem;font-weight:700;color:var(--sv);cursor:pointer;}
.cab+.cab{border-left:1px solid var(--bd);}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;}
.empty h3{font-size:1.3rem;font-weight:800;margin-bottom:6px;}
.empty p{font-size:.8rem;color:var(--sv);}
.pp{padding:14px;}
.pp-t{font-size:1.1rem;font-weight:800;margin-bottom:12px;color:var(--sv);text-transform:uppercase;letter-spacing:1px;}
.pr{display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;background:var(--g1);border:1px solid var(--bd);margin-bottom:9px;cursor:pointer;}
.pi2{flex:1;}
.pn{font-size:1rem;font-weight:700;}
.pc2{font-size:.72rem;color:var(--sv);margin-top:2px;}
.sp{padding:14px;}
.spt{font-size:1.1rem;font-weight:800;margin-bottom:12px;color:var(--sv);text-transform:uppercase;letter-spacing:1px;}
.sbig{background:linear-gradient(135deg,rgba(106,13,173,.6),rgba(255,0,110,.25));border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px;text-align:center;}
.sbv{font-size:3rem;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--pk),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sbl{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--sv);margin-top:3px;}
.pbt{flex:1;height:7px;background:var(--g2);border-radius:4px;overflow:hidden;}
.pbf{height:100%;background:linear-gradient(90deg,var(--bl3),var(--pk));border-radius:4px;}
.ip{padding:14px;}
.ip-t{font-size:1.1rem;font-weight:800;margin-bottom:12px;color:var(--sv);text-transform:uppercase;letter-spacing:1px;}
.dsec{background:var(--g1);border:1px solid var(--bd);border-radius:12px;padding:14px;}
.dst{font-size:.65rem;font-weight:700;text-transform:uppercase;color:var(--sv);margin-bottom:10px;}
.dsr{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.ddot{width:9px;height:9px;border-radius:50%;background:var(--sv);flex-shrink:0;}
.ddot.on{background:#2ecc71;box-shadow:0 0 7px #2ecc71;}
.dstx{font-size:.85rem;color:var(--sv);}
.dbtn{width:100%;height:46px;border-radius:11px;border:none;color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:7px;}
.dbtn:disabled{opacity:.4;cursor:not-allowed;}
.db1{background:linear-gradient(135deg,#1a73e8,#0d47a1);}
.db2{background:linear-gradient(135deg,#2ecc71,#27ae60);}
.db3{background:linear-gradient(135deg,#f39c12,#e67e22);}
.db4{background:transparent;border:1px solid rgba(255,0,110,.4);color:var(--pk);}
.sov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:none;align-items:flex-end;}
.sov.open{display:flex;}
.sht{width:100%;max-height:92vh;background:#1a0a2e;border-radius:18px 18px 0 0;border-top:2px solid var(--pk);display:flex;flex-direction:column;animation:sup .25s ease;}
@keyframes sup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.shdl{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:11px auto 0;flex-shrink:0;}
.shhd{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.shtt{font-size:1.1rem;font-weight:800;}
.shcl{width:30px;height:30px;border-radius:50%;background:var(--g1);border:1px solid var(--bd);color:#fff;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.shbd{flex:1;overflow-y:auto;padding:14px 18px;padding-bottom:calc(var(--sb) + 14px);}
.fg{margin-bottom:12px;}
.fl{display:block;font-size:.67rem;font-weight:700;text-transform:uppercase;color:var(--sv);margin-bottom:4px;}
.fi,.fse,.fta{width:100%;height:44px;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:10px;padding:0 12px;color:#fff;font-size:.88rem;outline:none;-webkit-appearance:none;appearance:none;}
.fse option{background:#1a0a2e;}
.fta{height:auto;min-height:75px;padding:10px 12px;resize:none;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.tgg{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.tl{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--bd);cursor:pointer;font-size:.78rem;font-weight:600;}
.tl input[type=checkbox]{display:none;}
.tsw{width:32px;height:18px;border-radius:9px;background:rgba(255,255,255,.15);position:relative;flex-shrink:0;margin-left:auto;}
.tsw::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .15s;}
.tl input:checked+.tsw{background:var(--pk);}
.tl input:checked+.tsw::after{transform:translateX(14px);}
.iup{border:2px dashed var(--bd);border-radius:12px;aspect-ratio:2.5/3.5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;position:relative;overflow:hidden;background:rgba(255,255,255,.03);}
.iup.hi{border-style:solid;}
.iup img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.iov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;font-size:.88rem;font-weight:700;}
.iup.hi:active .iov{display:flex;}
.ibtns{display:flex;gap:7px;margin-top:7px;}
.ibtn{flex:1;height:36px;border-radius:9px;background:var(--g1);border:1px solid var(--bd);color:#fff;font-size:.72rem;font-weight:700;cursor:pointer;}
.ibtn:disabled{opacity:.4;}
.ibtn.red{color:var(--pk);border-color:rgba(255,0,110,.35);}
.svbtn{width:100%;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--pk),var(--pk2));border:none;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:5px;}
.dimg{width:100%;aspect-ratio:2.5/3.5;border-radius:12px;overflow:hidden;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:14px;}
.dimg img{width:100%;height:100%;object-fit:cover;}
.drows{display:flex;flex-direction:column;gap:7px;}
.drow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:9px;}
.dk{font-size:.67rem;font-weight:700;text-transform:uppercase;color:var(--sv);}
.dv{font-size:.88rem;font-weight:600;}
.dv.yes{color:#2ecc71;}.dv.no{color:var(--sv);}
.dac{display:flex;gap:9px;margin-top:14px;}
.ded{flex:1;height:46px;border-radius:12px;background:var(--bl3);border:none;color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;}
.dde{width:46px;height:46px;border-radius:12px;background:rgba(255,0,110,.18);border:1px solid rgba(255,0,110,.35);color:var(--pk);font-size:1rem;cursor:pointer;}
.cw{border-radius:11px;overflow:hidden;background:#000;margin-bottom:10px;}
#cc{width:100%;display:block;touch-action:none;}
.crs{display:flex;gap:7px;}
.crb{flex:1;height:36px;border-radius:9px;background:var(--g1);border:1px solid var(--bd);color:#fff;font-size:.72rem;font-weight:700;cursor:pointer;}
.acr{width:100%;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--pk),var(--pk2));border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:9px;}
.tw{position:fixed;bottom:calc(var(--nav) + var(--sb) + 70px);left:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:5px;pointer-events:none;}
.toast{background:#2d0a50;border:1px solid var(--bd);border-radius:10px;padding:11px 14px;font-size:.88rem;font-weight:600;animation:tin .22s ease;}
.toast.s{border-color:var(--pk);}.toast.e{border-color:#e74c3c;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:768px){html,body{display:flex;align-items:center;justify-content:center;background:#0d0020;}#app{max-width:420px;border-radius:16px;box-shadow:0 0 60px rgba(255,0,110,.3);}
.sov{align-items:center;justify-content:center;padding:20px;}.sht{max-width:500px;width:100%;max-height:88vh;border-radius:16px;}
.fab{position:absolute;}@keyframes sup{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}}
</style>
</head>
<body>
<div id="app">
  <div class="stb"></div>
  <header class="hdr">
    <div class="logo">✨ Kelly Cards ✨</div>
  </header>
  <div class="pages">
    <div class="page active" id="page-home">
      <div class="ss">
        <div class="sc"><div class="sv2" id="s1">0</div><div class="sl2">Cartes</div></div>
        <div class="sc"><div class="sv2" id="s2">0</div><div class="sl2">Foil</div></div>
        <div class="sc"><div class="sv2" id="s3">0</div><div class="sl2">Grad.</div></div>
        <div class="sc"><div class="sv2" id="s4">0</div><div class="sl2">Ltd</div></div>
      </div>
      <div class="sw"><span class="sic">&#128269;</span><input class="sin" type="search" id="si" placeholder="Rechercher..." oninput="rc()"></div>
      <div class="chips" id="pchips">
        <div class="chip active" onclick="fp('all',this)">Toutes</div>
        <div class="chip" onclick="fp('disney',this)">Disney Lorcana</div>
        <div class="chip" onclick="fp('neon',this)">Neon</div>
        <div class="chip" onclick="fp('autres',this)">Autres</div>
      </div>
      <div class="cgrid" id="cg"></div>
    </div>
    <div class="page" id="page-cats">
      <div class="pp"><div class="pp-t">Categories</div><div id="pl"></div></div>
    </div>
    <div class="page" id="page-stats">
      <div class="sp"><div class="spt">Statistiques</div><div id="sc2"></div></div>
    </div>
    <div class="page" id="page-import">
      <div class="ip">
        <div class="ip-t">Sauvegarde</div>
        <div class="dsec">
          <div class="dst">Google Drive</div>
          <div class="dsr"><div class="ddot" id="dot"></div><div class="dstx" id="stx">Non connecte</div></div>
          <button class="dbtn db1" id="blo" onclick="dsi()">Se connecter</button>
          <button class="dbtn db2" id="bsa" onclick="std()" disabled>Sauvegarder sur Drive</button>
          <button class="dbtn db3" id="blo2" onclick="lfd()" disabled>Charger depuis Drive</button>
          <button class="dbtn db4" id="bou" onclick="dso()" style="display:none">Se deconnecter</button>
        </div>
      </div>
    </div>
  </div>
  <button class="fab" onclick="oas()">+</button>
  <nav class="bnav">
    <div class="ni active" id="nav-home" onclick="op('home')"><div class="ni-ico">&#10024;</div><div class="ni-lbl">Collection</div></div>
    <div class="ni" id="nav-cats" onclick="op('cats')"><div class="ni-ico">&#127903;</div><div class="ni-lbl">Categories</div></div>
    <div class="ni" id="nav-stats" onclick="op('stats')"><div class="ni-ico">&#128202;</div><div class="ni-lbl">Stats</div></div>
    <div class="ni" id="nav-import" onclick="op('import')"><div class="ni-ico">&#9729;</div><div class="ni-lbl">Drive</div></div>
  </nav>
</div>

<!-- ADD/EDIT -->
<div class="sov" id="sadd">
  <div class="sht">
    <div class="shdl"></div>
    <div class="shhd"><span class="shtt" id="sat">Nouvelle Carte</span><button class="shcl" onclick="cs('sadd')">X</button></div>
    <div class="shbd">
      <div class="fg">
        <label class="fl">Photo</label>
        <div class="iup" id="iua" onclick="ti()">
          <div style="font-size:2rem;opacity:.3">+</div>
          <div style="font-size:.78rem;color:var(--sv)">Appuyer pour ajouter</div>
          <div class="iov">Changer</div>
        </div>
        <input type="file" id="ii" accept="image/*" style="display:none" onchange="hii(event)">
        <div class="ibtns">
          <button class="ibtn" onclick="ti()">Photo</button>
          <button class="ibtn" id="cb" onclick="ocs()" disabled>Recadrer</button>
          <button class="ibtn red" id="delbtn" onclick="delPhoto()" disabled>Suppr.</button>
        </div>
      </div>
      <div class="fg"><label class="fl">Categorie</label>
        <select class="fse" id="fc">
          <option value="">Selectionner...</option>
          <option>Disney Lorcana</option>
          <option>Neon</option>
          <option>Autres</option>
        </select>
      </div>
      <div class="fg"><label class="fl">Nom / Titre</label><input class="fi" type="text" id="fn" placeholder="Ex: Elsa - Enchanted"></div>
      <div class="g2">
        <div class="fg"><label class="fl">N. Carte</label><input class="fi" type="text" id="fnu" placeholder="#42"></div>
        <div class="fg"><label class="fl">Numerotee /</label><input class="fi" type="text" id="fpr" placeholder="/100"></div>
      </div>
      <div class="fg"><label class="fl">Rarete</label><input class="fi" type="text" id="fry" placeholder="Ex: Rare, Super Rare..."></div>
      <div class="fg">
        <label class="fl">Caracteristiques</label>
        <div class="tgg">
          <label class="tl"><span>Foil</span><input type="checkbox" id="ffo"><div class="tsw"></div></label>
          <label class="tl"><span>Numerotee</span><input type="checkbox" id="fnd"><div class="tsw"></div></label>
          <label class="tl"><span>Gradee</span><input type="checkbox" id="fgr"><div class="tsw"></div></label>
          <label class="tl"><span>Signee</span><input type="checkbox" id="fsi"><div class="tsw"></div></label>
          <label class="tl"><span>Limitee</span><input type="checkbox" id="fli"><div class="tsw"></div></label>
        </div>
      </div>
      <div class="fg"><label class="fl">Grade PSA/BGS</label><input class="fi" type="text" id="fgd" placeholder="Ex: PSA 10"></div>
      <div class="fg"><label class="fl">Notes</label><textarea class="fta" id="fde" placeholder="Condition, set..."></textarea></div>
      <button class="svbtn" onclick="svc()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="sov" id="sdet">
  <div class="sht">
    <div class="shdl"></div>
    <div class="shhd"><span class="shtt" id="dtt">Detail</span><button class="shcl" onclick="cs('sdet')">X</button></div>
    <div class="shbd">
      <div class="dimg" id="dim"></div>
      <div class="drows" id="dro"></div>
      <div class="dac"><button class="ded" id="bde">Modifier</button><button class="dde" id="bdd">Suppr</button></div>
    </div>
  </div>
</div>

<!-- CROP -->
<div class="sov" id="scr">
  <div class="sht">
    <div class="shdl"></div>
    <div class="shhd"><span class="shtt">Recadrer</span><button class="shcl" onclick="cs('scr')">X</button></div>
    <div class="shbd">
      <div class="cw"><canvas id="cc"></canvas></div>
      <div class="crs">
        <button class="crb" onclick="crt(2.5/3.5)">Carte</button>
        <button class="crb" onclick="crt(1)">Carre</button>
        <button class="crb" onclick="crt(4/3)">4:3</button>
      </div>
      <button class="acr" onclick="acrp()">Appliquer</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div id="confirmBox" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px;">
  <div style="background:#1a0a2e;border:1px solid var(--pk);border-radius:16px;padding:24px;max-width:340px;width:100%;">
    <div id="confirmMsg" style="font-size:.95rem;font-weight:600;margin-bottom:20px;line-height:1.5;color:#fff;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="doConfirm(false)" style="flex:1;height:44px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;">Annuler</button>
      <button onclick="doConfirm(true)" style="flex:1;height:44px;border-radius:10px;background:var(--pk);border:none;color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;">Confirmer</button>
    </div>
  </div>
</div>
<div class="tw" id="tw"></div>

<script>
// ── IndexedDB
var idb=null;
function openIDB(cb){if(idb){cb(idb);return;}var req=indexedDB.open('kellycards',1);req.onupgradeneeded=function(e){e.target.result.createObjectStore('photos');};req.onsuccess=function(e){idb=e.target.result;cb(idb);};req.onerror=function(){cb(null);};}

function ld(){
  try{
    var meta=localStorage.getItem('kc_meta');
    if(meta){var m=JSON.parse(meta);col=[];for(var i=0;i<m.chunks;i++){var chunk=localStorage.getItem('kc_'+i);if(chunk)col=col.concat(JSON.parse(chunk));}}
    else{col=JSON.parse(localStorage.getItem('kc')||'[]');}
  }catch(e){col=[];}
  try{
    idbGetAll(function(imgs){
      for(var i=0;i<col.length;i++){var img=imgs['img_'+col[i].id];if(img)pc['local_'+col[i].id]=img;}
      us();rc();
    });
  }catch(e){us();rc();}
  setTimeout(function(){us();rc();},600);

function sl(){
  try{
    var data=col.map(function(card){var o={};for(var k in card){if(k==='image'){o.image=(card.image&&card.image.indexOf('drive:')===0)?card.image:null;}else o[k]=card[k];}return o;});
    var CHUNK=150;var chunks=Math.ceil(data.length/CHUNK)||1;
    localStorage.setItem('kc_meta',JSON.stringify({chunks:chunks,total:data.length}));
    for(var i=0;i<chunks;i++)localStorage.setItem('kc_'+i,JSON.stringify(data.slice(i*CHUNK,(i+1)*CHUNK)));
  }catch(e){}
}

    if(c.limited)b+='<span class="b bii">LTD</span>';

      is=pc['local_'+c.id]||null;
      if(!is)(function(cardId,fid){lpb(fid,function(img){if(img){pc['local_'+cardId]=img;idbSet('img_'+cardId,img);var el2=document.querySelector('[data-cid="'+cardId+'"] .ph');if(el2)el2.outerHTML='<img src="'+img+'" loading="lazy">';}});})(c.id,c.image.replace('drive:',''));

  g('fgr').checked=!!c.graded;g('fsi').checked=!!c.signed;g('fli').checked=!!c.limited;

  var ex=eid?gbi(eid):null;

function compress(src,cb){var img=new Image();img.onload=function(){var MAX=560,w=img.width,h=img.height;if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.7));};img.src=src;}

function ic(src){ccanvas=g('cc');cctx=ccanvas.getContext('2d');cropI=new Image();cropI.onload=function(){var w=ccanvas.parentElement.offsetWidth,sc=w/cropI.width;ccanvas.width=w;ccanvas.height=Math.min(380,cropI.height*sc);crect={x:20,y:20,w:w*0.6,h:w*0.6*(3.5/2.5)};if(crect.y+crect.h>ccanvas.height-20){crect.h=ccanvas.height-40;crect.w=crect.h*(2.5/3.5);}drc();ace();};cropI.src=src;}

function ace(){var cv=ccanvas;function gp(e){var r=cv.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)};}function dn(e){var p=gp(e);var cs=[{x:crect.x,y:crect.y,t:'tl'},{x:crect.x+crect.w,y:crect.y,t:'tr'},{x:crect.x,y:crect.y+crect.h,t:'bl'},{x:crect.x+crect.w,y:crect.y+crect.h,t:'br'}];for(var i=0;i<cs.length;i++){if(Math.abs(p.x-cs[i].x)<18&&Math.abs(p.y-cs[i].y)<18){ir=true;rt=cs[i].t;ds=p;return;}}if(p.x>crect.x&&p.x<crect.x+crect.w&&p.y>crect.y&&p.y<crect.y+crect.h){dr=true;ds={x:p.x-crect.x,y:p.y-crect.y};}}function mv(e){if(e.cancelable)e.preventDefault();var p=gp(e);if(ir){var dx=p.x-ds.x,dy=p.y-ds.y;ds=p;var x=crect.x,y=crect.y,w=crect.w,h=crect.h;if(rt.indexOf('r')>=0)w=Math.max(40,w+dx);if(rt.indexOf('l')>=0){x+=dx;w=Math.max(40,w-dx);}if(rt.indexOf('b')>=0)h=Math.max(40,h+dy);if(rt.indexOf('t')>=0){y+=dy;h=Math.max(40,h-dy);}crect={x:x,y:y,w:w,h:h};}else if(dr){crect.x=Math.max(0,Math.min(cv.width-crect.w,p.x-ds.x));crect.y=Math.max(0,Math.min(cv.height-crect.h,p.y-ds.y));}drc();}function up(){dr=false;ir=false;rt=null;}cv.onmousedown=dn;cv.onmousemove=mv;cv.onmouseup=up;cv.ontouchstart=dn;cv.ontouchmove=mv;cv.ontouchend=up;}

function dapi(path){var sep=path.indexOf('?')>=0?'&':'?';return fetch('https://www.googleapis.com/drive/v3/'+path+sep+'key='+AK,{headers:{Authorization:'Bearer '+at}}).then(function(r){return r.json();});}
function ef(){if(pfid)return Promise.resolve();return dapi("files?q=name='"+PFD+"' and mimeType='application/vnd.google-apps.folder' and trashed=false&fields=files(id)").then(function(r){if(r.files&&r.files.length>0){pfid=r.files[0].id;return;}return fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:'Bearer '+at,'Content-Type':'application/json'},body:JSON.stringify({name:PFD,mimeType:'application/vnd.google-apps.folder'})}).then(function(r){return r.json();}).then(function(f){pfid=f.id;});}).catch(function(e){console.warn(e);});}

function autoLoadPhotos(){var dp=[];for(var i=0;i<col.length;i++){if(col[i].image&&col[i].image.indexOf('drive:')===0&&!pc['local_'+col[i].id])dp.push({fid:col[i].image.replace('drive:',''),cid:col[i].id});}if(!dp.length)return;toast(dp.length+' photos en cours...','s');var total=dp.length,done=0,pos=0,BATCH=10;function run(){var end=Math.min(pos+BATCH,total);for(var j=pos;j<end;j++){(function(item){lpb(item.fid,function(img){done++;if(done%20===0||done===total)rc();if(done===total)toast('Photos chargees !','s');});})(dp[j]);}pos=end;if(pos<total)setTimeout(run,100);}run();}

function uop(cardId,imgData,cb){if(!at||!pfid){cb(null);return;}var fn='card_'+cardId+'.jpg';fetch(imgData).then(function(r){return r.blob();}).then(function(blob){return dapi("files?q=name='"+fn+"' and '"+pfid+"' in parents and trashed=false&fields=files(id)").then(function(s){if(s.files&&s.files.length>0){var eid2=s.files[0].id;return fetch('https://www.googleapis.com/upload/drive/v3/files/'+eid2+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+at,'Content-Type':'image/jpeg'},body:blob}).then(function(){return 'drive:'+eid2;});}var meta=new Blob([JSON.stringify({name:fn,parents:[pfid]})],{type:'application/json'});var form=new FormData();form.append('metadata',meta);form.append('file',blob);return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+at},body:form}).then(function(r){return r.json();}).then(function(f){return 'drive:'+f.id;});});}).then(function(url){cb(url);}).catch(function(){cb(null);});}
function lpb(fid,cb){if(pc['local_fid_'+fid]){cb(pc['local_fid_'+fid]);return;}if(!at){cb(null);return;}fetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media',{headers:{Authorization:'Bearer '+at}}).then(function(r){if(!r.ok)return null;return r.blob();}).then(function(blob){if(!blob){cb(null);return;}var fr=new FileReader();fr.onload=function(e){pc['local_fid_'+fid]=e.target.result;cb(e.target.result);};fr.readAsDataURL(blob);}).catch(function(){cb(null);});}

function saveFile(name,blob){return dapi("files?q=name='"+name+"' and trashed=false&fields=files(id)").then(function(s){if(s.files&&s.files.length>0){var fid=s.files[0].id;return fetch('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+at,'Content-Type':'application/json'},body:blob});}var meta=new Blob([JSON.stringify({name:name})],{type:'application/json'});var form=new FormData();form.append('metadata',meta);form.append('file',blob);return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+at},body:form});});}

function std(){
  if(!at){toast('Connecte-toi dabord','e');return;}
  var btn=g('bsa');btn.disabled=true;
  ef().then(function(){
    var toUp=[];
    for(var i=0;i<col.length;i++){var c=col[i];if(c.image&&c.image.indexOf('drive:')===0)continue;var localImg=pc['local_'+c.id];if(localImg)toUp.push({ci:i,id:c.id,img:localImg});}
    var CHUNK=150;
    var cleanCol=col.map(function(card){var o={};for(var k in card){if(k==='image'){o.image=(card.image&&card.image.indexOf('drive:')===0)?card.image:null;}else o[k]=card[k];}return o;});
    var chunks=Math.ceil(cleanCol.length/CHUNK)||1;
    function doSave(){
      var metaBlob=new Blob([JSON.stringify({chunks:chunks,total:cleanCol.length,savedAt:new Date().toISOString(),v:1})],{type:'application/json'});
      saveFile(DF+'.meta',metaBlob).then(function(){
        var idx=0;
        function next(){if(idx>=chunks){sl();rc();toast(cleanCol.length+' cartes sauvegardees !','s');btn.disabled=false;btn.textContent='Sauvegarder sur Drive';return;}btn.textContent='Sauvegarde '+(idx+1)+'/'+chunks+'...';var part=cleanCol.slice(idx*CHUNK,(idx+1)*CHUNK);var blob=new Blob([JSON.stringify(part)],{type:'application/json'});saveFile(DF+'.part'+idx,blob).then(function(){idx++;next();}).catch(function(e){toast('Erreur: '+e.message,'e');btn.disabled=false;btn.textContent='Sauvegarder sur Drive';});}
        next();
      });
    }
    if(!toUp.length){doSave();return;}
    btn.textContent='Photos 0/'+toUp.length+'...';var pos=0;
    function un(){if(pos>=toUp.length){doSave();return;}var item=toUp[pos];pos++;btn.textContent='Photo '+pos+'/'+toUp.length+'...';(function(ci,cid,img){uop(cid,img,function(url){if(url)col[ci].image=url;un();});})(item.ci,item.id,item.img);}
    un();
  });
}

function lfd(){
  if(!at){toast('Connecte-toi dabord','e');return;}
  var btn=g('blo2');btn.disabled=true;btn.textContent='Chargement...';
  function fetchFile(name){return dapi("files?q=name='"+name+"' and trashed=false&fields=files(id)").then(function(s){if(!s.files||!s.files.length)return null;var fid=s.files[0].id;return fetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media',{headers:{Authorization:'Bearer '+at}}).then(function(r){return r.text();}).then(function(txt){return JSON.parse(txt);});});}
  function doLoad(){fetchFile(DF+'.meta').then(function(meta){if(!meta){toast('Aucune sauvegarde','e');btn.disabled=false;btn.textContent='Charger depuis Drive';return;}var chunks=meta.chunks,parts=[],idx=0;function next(){if(idx>=chunks){col=[].concat.apply([],parts);sl();us();rc();toast(col.length+' cartes chargees !','s');btn.disabled=false;btn.textContent='Charger depuis Drive';autoLoadPhotos();return;}btn.textContent='Chargement '+(idx+1)+'/'+chunks+'...';fetchFile(DF+'.part'+idx).then(function(part){parts.push(part||[]);idx++;next();}).catch(function(e){toast('Erreur: '+e.message,'e');btn.disabled=false;btn.textContent='Charger depuis Drive';});}next();}).catch(function(e){toast('Erreur: '+e.message,'e');btn.disabled=false;btn.textContent='Charger depuis Drive';});}
  if(col.length>0){appConfirm('Remplacer par la sauvegarde Drive ?',function(ok){if(!ok){btn.disabled=false;btn.textContent='Charger depuis Drive';return;}doLoad();});}else doLoad();
}

function appConfirm(msg,cb){_confirmCb=cb;g('confirmMsg').textContent=msg;g('confirmBox').style.display='flex';}
function doConfirm(val){g('confirmBox').style.display='none';if(_confirmCb){var cb=_confirmCb;_confirmCb=null;cb(val);}}
function os(id){g(id).classList.add('open');}
function cs(id){g(id).classList.remove('open');}
document.querySelectorAll('.sov').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});});
function toast(msg,type){var w=g('tw');var t=document.createElement('div');t.className='toast '+(type||'s');t.textContent=msg;w.appendChild(t);setTimeout(function(){t.remove();},3500);}
